services:
  - type: web
    name: frameforge-backend
    runtime: python
    region: singapore          # change to your preferred region
    plan: free                 # free tier — upgrades available
    rootDir: backend
    buildCommand: "apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        value: "https://frameforge.vercel.app"   # update with your Vercel URL after deploy
    healthCheckPath: /health
